[package]
name        = "paperclaw-cli"
version     = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

description = "PaperClaw command-line interface and composition root."

[[bin]]
name = "paperclaw"
path = "src/main.rs"

[dependencies]
paperclaw-domain   = { workspace = true }
paperclaw-app      = { workspace = true }
paperclaw-adapters = { workspace = true }

anyhow             = { workspace = true }
clap               = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
config             = { workspace = true }
dotenvy            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
base64             = { workspace = true }

[dev-dependencies]
tempfile         = { workspace = true }
tokio            = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "io-util", "time"] }
paperclaw-domain = { workspace = true, features = ["testing"] }
serde_json       = { workspace = true }
time             = { workspace = true }
async-trait      = { workspace = true }
base64           = { workspace = true }

[lints]
workspace = true
